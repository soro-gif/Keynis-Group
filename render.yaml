databases:
  - name: keynis-db
    databaseName: keynis
    user: keynis
    plan: free

services:
  - type: web
    name: keynis-group
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "Keynis Trading & Logistics Group"
      - key: APP_ENV
        value: production
      - key: APP_KEY
        sync: false      # `generateValue` produit une chaîne invalide pour Laravel (pas au format
                          # base64:<32 octets>) -> à définir manuellement dans le dashboard Render
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://www.keynisgroup.ci
      - key: APP_LOCALE
        value: fr
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: debug
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: PHP_CLI_SERVER_WORKERS
        value: "4"
      - key: RUN_SEEDERS
        value: "true"
      - key: ADMIN_PASSWORD
        sync: false      # optionnel : si défini, (ré)initialise le mot de passe de
                          # admin@keynisgroup.ci à chaque déploiement (utile sans accès Shell)

      # Envoi d'e-mails (obligatoire pour la réinitialisation de mot de passe) :
      # sans ces variables, MAIL_MAILER retombe sur "log" et les e-mails ne sont
      # jamais réellement envoyés, ils sont seulement écrits dans les logs.
      # Fournisseur : Resend, via son API HTTPS (pas de connexion SMTP) — le plan
      # gratuit de Render bloque tout le trafic sortant vers les ports SMTP
      # (25/465/587), donc un mailer SMTP classique (Gmail, Brevo, cPanel...) ne
      # peut pas fonctionner ici tant que le service reste sur le plan free.
      # RESEND_API_KEY vient de resend.com > API Keys, une fois le domaine
      # keynisgroup.ci vérifié (resend.com > Domains).
      - key: MAIL_MAILER
        value: resend
      - key: RESEND_API_KEY
        sync: false      # clé API Resend (commence par "re_")
      - key: MAIL_FROM_ADDRESS
        value: "contact@keynisgroup.ci"
      - key: MAIL_FROM_NAME
        value: "Keynis Trading & Logistics Group"

      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase: { name: keynis-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: keynis-db, property: port }
      - key: DB_DATABASE
        fromDatabase: { name: keynis-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: keynis-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: keynis-db, property: password }
      - key: DB_SSLMODE
        value: require

      # Stockage S3-compatible (ex. Cloudflare R2) pour les médias uploadés :
      # le disque du service web est éphémère, donc AWS_BUCKET doit être défini
      # pour que config/filesystems.php bascule le disque "public" sur S3.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_BUCKET
        sync: false
      - key: AWS_URL
        sync: false      # URL publique du bucket, ex. https://pub-xxxx.r2.dev
      - key: AWS_ENDPOINT
        sync: false      # endpoint S3 du provider, ex. https://<account_id>.r2.cloudflarestorage.com
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"
